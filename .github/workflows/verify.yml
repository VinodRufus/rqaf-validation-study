name: Verify public release

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Audit public files
        run: python src/common/audit.py
      - name: Recompute statistics from the frozen run logs
        run: python tools/rqaf_stats.py && python tools/rqaf_secondary_stats.py && git diff --exit-code -- results/rqaf/*.csv
